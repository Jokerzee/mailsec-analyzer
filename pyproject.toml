[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mailsec-analyzer"
version = "0.1.0"
description = "离线邮件安全分析器：拆解钓鱼邮件的认证、发件人、URL、附件与社工特征"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "mailsec-analyzer contributors" }]
keywords = ["security", "phishing", "email", "dfir", "blue-team"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security",
]
dependencies = []

[project.scripts]
mailsec = "mailsec.cli:main"

[tool.setuptools.packages.find]
include = ["mailsec*"]
